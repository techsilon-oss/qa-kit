name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    env:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the private-terms check reads every commit message

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # A pull request from a fork cannot read repository secrets, so this step
      # runs only for pushes and for pull requests from this repository.
      - name: Check private terms
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/check-private-terms.mjs --require

      - run: npm ci
      - run: npm test
