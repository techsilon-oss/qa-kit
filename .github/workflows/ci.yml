name: CI

# Every push runs CI, on any branch. A pull request from this repo is already
# covered by the push of its branch, so the pull_request event runs only for
# pull requests from forks.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the private-terms check reads every commit message

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # A pull request from a fork cannot read repository secrets, so this step
      # runs only for pushes.
      - name: Check private terms
        if: github.event_name == 'push'
        run: node scripts/check-private-terms.mjs --require

      - run: npm ci
      - run: npm test
